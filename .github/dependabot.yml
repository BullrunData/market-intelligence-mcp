version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    ignore:
      # @vercel/node > 5.7.17 breaks MCP session lifecycle (POST-tools/call session
      # reuse fails, DELETE session returns 400). Bisected 2026-08-08 — versions
      # 5.9.5 and 5.9.3 both regress. Repin here only after upstream fix confirmed.
      - dependency-name: "@vercel/node"
